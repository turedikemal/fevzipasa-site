<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"><script src="/basvuru/basvuru.js" defer></script><title>Başvuru | Fevzipaşa Tasarım Pazarı</title>
<style>
:root{--orange:#df4309;--yellow:#ffed8c;--pink:#ff29f1;--ink:#151515}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,Arial,sans-serif;color:var(--ink);background:var(--yellow);line-height:1.55}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;background:#fff;border-bottom:1px solid #eee}
.wordmark{font-size:17px;font-weight:800;letter-spacing:-.6px;line-height:1.05;color:var(--orange);text-decoration:none}
.mono{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:1.5px}
main{max-width:760px;margin:0 auto;padding:50px 6% 80px}
h1{font-size:clamp(40px,7vw,78px);letter-spacing:-.065em;line-height:.98;color:var(--orange);margin:14px 0 20px}
.intro{font-size:18px;white-space:pre-wrap}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-family:'Roboto Mono',monospace;font-size:13px;margin:22px 0 36px;padding:14px 0;border-top:1px solid #0003;border-bottom:1px solid #0003}
form{display:grid;gap:26px}
.q{display:grid;gap:8px}.q>b{font-size:16px}.q small{color:#555}
.q input[type=text],.q input[type=email],.q input[type=tel],.q input[type=url],.q input[type=number],.q input[type=date],.q select,.q textarea{width:100%;padding:13px 14px;border:1px solid #0003;border-radius:10px;background:#fff;font:inherit}
.q textarea{min-height:130px;resize:vertical}
.ig{display:flex;align-items:center;border:1px solid #0003;border-radius:10px;background:#fff;padding-left:14px}.ig>span{font-weight:800;color:var(--orange)}.q .ig input[type=text]{border:0;padding-left:4px;border-radius:10px}
.q input:focus,.q select:focus,.q textarea:focus{outline:3px solid var(--orange);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts label{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #0003;border-radius:30px;padding:9px 16px;cursor:pointer;font-weight:600}
.opts label:has(input:checked){background:var(--ink);color:#fff}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:600;cursor:pointer}.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--orange)}
h2{font-size:30px;letter-spacing:-.05em;margin:18px 0 -6px}
.drop{border:2px dashed #0004;border-radius:14px;background:#fffbe0;padding:22px;text-align:center;cursor:pointer}.drop.over{border-color:var(--orange);background:#fff}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.files figure{margin:0;position:relative;aspect-ratio:1;background:#fff;border-radius:10px;overflow:hidden}.files img{width:100%;height:100%;object-fit:cover}
.files button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:#000a;color:#fff;cursor:pointer}
.send{justify-self:start;border:0;background:var(--orange);color:#fff;border-radius:60px;padding:16px 30px;font:inherit;font-weight:800;font-size:16px;cursor:pointer}.send:disabled{opacity:.6}
.err{color:#b00020;font-weight:700}
.done{background:#fff;border-radius:20px;padding:40px;text-align:center}.done h1{margin-top:0}
.closed{background:#fff;border-radius:20px;padding:30px}
.preview{background:#151515;color:#ffed8c;padding:18px 22px;border-radius:14px;margin:0 0 26px}.preview p{margin:6px 0 0}.send:disabled{opacity:.45;cursor:not-allowed}
</style></head><body><header><a class="wordmark" href="/">FEVZİPAŞA<br>TASARIM PAZARI</a><span class="mono">BAŞVURU</span></header><main id="root"><p class="mono">Yükleniyor…</p></main></body></html>
